# MC 公链 · nginx 反向代理配置（RPC/REST/gRPC 对外层）
#
# 定位：docs/NODE_CONFIG.md §2-3 的「Sentry / RPC Provider」对外出口。
# 职责：TLS 终结 + 限流 + 基础防护头 + 超时熔断。
# 用法：放到 /etc/nginx/sites-available/mcchain.conf 并软链到 sites-enabled，
#       按需替换 server_name / 证书路径 / upstream 端口。
#
# 限流口径（第一阶段验收标准，见 CAPACITY_PLAN.md）：
#   REST  ≤ 200 QPS/IP，burst 400
#   RPC   ≤ 50  QPS/IP（JSON-RPC 比 REST 重），burst 100
#   gRPC  不走 nginx（gRPC 建议 h2c 直连或单独入口），此处仅暴露 grpc-web

# ───────────────────────────── 全局限流区 ─────────────────────────────
limit_req_zone $binary_remote_addr zone=rest_limit:20m rate=200r/s;
limit_req_zone $binary_remote_addr zone=rpc_limit:20m  rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;

# 上游：本机 RPC / REST 端口
upstream mcchain_rpc  { server 127.0.0.1:26657; keepalive 32; }
upstream mcchain_rest { server 127.0.0.1:1317;  keepalive 64; }

# ───────────────────────────── REST (LCD) ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.mcchain.example;

    # 证书路径（certbot 自动续期，证书到期前 30 天告警见 ALERTS.md）
    ssl_certificate     /etc/letsencrypt/live/api.mcchain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mcchain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 基础防护头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 连接上限：单 IP ≤ 32 并发
    limit_conn conn_per_ip 32;

    # 请求体上限（GET 为主，保守给 1m）
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    location / {
        limit_req zone=rest_limit burst=400 nodelay;
        limit_req_status 429;

        proxy_pass http://mcchain_rest;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    15s;
        # 上游异常时返回标准 503（客户端熔断切换依据，见 web/endpoints.json）
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }

    # 禁用不必要的方法
    if ($request_method !~ ^(GET|HEAD|OPTIONS|POST)$) { return 405; }
}

# ───────────────────────────── JSON-RPC (26657) ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name rpc.mcchain.example;

    ssl_certificate     /etc/letsencrypt/live/rpc.mcchain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.mcchain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;

    limit_conn conn_per_ip 16;
    client_max_body_size 2m;   # 广播 tx 场景，放宽一点

    # JSON-RPC over HTTP
    location / {
        limit_req zone=rpc_limit burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://mcchain_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # block 查询可能较慢
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }

    # WebSocket（事件订阅，见 docs/sdk_event_contract.md）
    location /websocket {
        proxy_pass http://mcchain_rpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # 长连接
        proxy_send_timeout 3600s;
    }

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
}

# ───────────────────────────── HTTP→HTTPS 强制跳转 ─────────────────────────────
server {
    listen 80;
    server_name api.mcchain.example rpc.mcchain.example;
    return 301 https://$host$request_uri;
}
