name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: "1.22.5"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 格式检查前置：未格式化的代码在评审里会淹没真正的改动，
      # 而且 gofmt 是零争议的，没有理由放进人工评审。
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt（本地运行 gofmt -w 修复）："
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        run: go test ./... -coverprofile=coverage.out

      # 数据竞争只在并发路径上暴露，常规测试跑一百遍也未必命中一次。
      # 共识代码一旦有 race，表现是「链在某些节点上高度分叉」，排查成本极高，
      # 因此这里用 -race 全量跑一遍作为门禁。
      - name: Race detector
        run: go test -race -timeout 30m ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 短时 fuzz 不是「找齐所有 bug」，而是**防止不变量被悄悄改坏**：
      # 每个靶对应一条明确的安全/经济约束（见各 fuzz_test.go 的说明），
      # 一旦有人改动这些归一化/闸门逻辑而破坏约束，这里会立刻红。
      # 时间取 20s：足够覆盖已知边界的邻域，又不会把 CI 拖长。
      - name: Fuzz targets (20s each)
        run: |
          set -e
          fuzz() { echo "::group::fuzz $2"; go test "./$1/" -run '^$' -fuzz "^$2\$" -fuzztime 20s; echo "::endgroup::"; }
          fuzz x/phonenode/keeper FuzzValidateAttestationInputs
          fuzz x/phonenode/keeper FuzzNormalizeAllowanceConfig
          fuzz x/referral/keeper  FuzzReleaseScheduleNormalize
          fuzz x/dex/keeper       FuzzValidateSettlementAuthority
          fuzz x/mcchain/keeper   FuzzNormalizeHandoverConfig

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 依赖链漏洞扫描：本链的依赖面很宽（Cosmos SDK / CometBFT / IBC / CosmWasm），
      # 其中任何一个的已知漏洞都会直接变成链的攻击面。这类信息只能靠外部数据库，
      # 静态评审看不出来。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m

  genesis:
    name: Genesis params
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 创世参数固化的回归测试。
      # 这些参数一旦写错，后果是「链起不来」或「验证人被莫名 jail」，
      # 而两者都要到主网 InitChain 或首日运行才暴露，代价极高。
      - name: 创世参数回归测试
        run: python scripts/test_genesis_params.py

  docs:
    name: Docs consistency & generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) 文档一致性门禁：陈旧版本串 / MUST_HAVE / 事件文档漂移。
      #    docs/generated/ 不入库，门禁改为生成到临时目录并与本地副本比对；
      #    本地无副本时仅校验「生成成功且非空」。
      - name: Docs consistency gate
        run: python scripts/check_docs_consistency.py

      # 2) 生成类文档（events.md）由 CI 生成并归档为 artifact，
      #    开发者无需手工提交生成物，避免「改了事件忘了同步文档」。
      - name: Generate events doc (artifact)
        run: |
          mkdir -p docs-generated-artifact
          python scripts/gen_events_doc.py --out docs-generated-artifact/events.md

      - name: Upload generated docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: docs-generated-artifact/
          if-no-files-found: error

  e2e:
    name: E2E smoke (init -> block -> CLI/REST/gRPC -> transfer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 真实二进制冒烟：从 0 初始化 devnet、出块、验证 CLI bank / REST 1317 /
      # gRPC 9090 / 转账全链路。单验证人模式，约 2-3 分钟，跑在 PR 与 main 上。
      # 用途：把「能编译」升级为「能跑通」，拦截 devnet/端口/路由等运行时回归。
      - name: Build mcchaind
        run: go build -o build/mcchaind ./cmd/mcchaind

      - name: Run e2e smoke
        run: bash tests/e2e/smoke.sh
        env:
          MCCHAIND: ${{ github.workspace }}/build/mcchaind
          VALIDATORS: "1"
          BLOCK_TIME: "2s"
