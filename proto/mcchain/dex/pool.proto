syntax = "proto3";
package mcchain.dex;
option go_package = "mcchain/x/dex/types";

message Pool {
  uint64 id = 1;
  string denom_a = 2;
  string denom_b = 3;
  string reserve_a = 4;
  string reserve_b = 5;
  string total_lp = 6;
  uint32 fee_rate_bps = 7;
  string owner = 8;
}

message LiquidityLock {
  string lp_address = 1;
  uint64 pool_id = 2;
  uint64 lock_height = 3;
  uint64 unlock_height = 4;
  string lp_amount = 5;
}
